name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm --prefix console ci
      - run: npm --prefix console run typecheck
      - run: npm --prefix console run build

  cortex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cortex/requirements.txt pytest
      - run: cd cortex && python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [api, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t careerpilot .
