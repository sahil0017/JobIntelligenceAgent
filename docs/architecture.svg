<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; }
    .ai { stroke: #a78bfa; }
    .pub { stroke: #34d399; }
    .t { fill: #f8fafc; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
    .l { fill: #cbd5e1; font-size: 11px; text-anchor: middle; }
    .vol { fill: #1e293b; stroke: #f59e0b; stroke-width: 1.5; }
    .vt { fill: #fbbf24; font-size: 11px; text-anchor: middle; }
    .wire { stroke: #334155; stroke-width: 2; fill: none; stroke-dasharray: 5 5; animation: dash 1.2s linear infinite; }
    .deploy { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: dash 0.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="460" rx="14" fill="#020617"/>
  <text x="450" y="30" class="t" style="font-size:18px">CareerPilot AI on Railway: end to end</text>

  <!-- GitHub deploy flow -->
  <rect x="20" y="60" width="120" height="60" rx="10" class="box" style="stroke:#f59e0b"/>
  <text x="80" y="87" class="t">GitHub</text>
  <text x="80" y="106" class="s">push to main</text>
  <path d="M140,90 H170" class="deploy"/>
  <text x="155" y="78" class="l">deploy</text>

  <!-- Railway project -->
  <rect x="170" y="50" width="710" height="390" rx="14" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="190" y="72" class="s" style="text-anchor:start">Railway project, private network (*.railway.internal)</text>

  <!-- Wires -->
  <path id="p1" d="M140,250 H210" class="wire"/>
  <path id="p2" d="M350,250 H410" class="wire"/>
  <path id="p3" d="M560,230 L660,150" class="wire"/>
  <path id="p4" d="M560,270 L660,350" class="wire"/>
  <path id="p5" d="M755,185 V315" class="wire"/>

  <!-- Browser -->
  <rect x="20" y="210" width="120" height="80" rx="10" class="box pub"/>
  <text x="80" y="245" class="t">Browser</text>
  <text x="80" y="265" class="s">user</text>
  <text x="175" y="238" class="l">HTTPS</text>

  <!-- Web -->
  <rect x="210" y="210" width="140" height="80" rx="10" class="box pub"/>
  <text x="280" y="238" class="t">careerpilot-web</text>
  <text x="280" y="256" class="s">nginx + React</text>
  <text x="280" y="273" class="s">public domain</text>
  <text x="380" y="238" class="l">/api/*</text>

  <!-- API -->
  <rect x="410" y="200" width="150" height="100" rx="10" class="box"/>
  <text x="485" y="232" class="t">careerpilot-api</text>
  <text x="485" y="252" class="s">Go backend</text>
  <text x="485" y="270" class="s">private</text>
  <rect x="425" y="318" width="120" height="30" rx="6" class="vol"/>
  <text x="485" y="338" class="vt">SQLite  /data</text>

  <!-- Cortex -->
  <rect x="660" y="110" width="190" height="80" rx="10" class="box ai"/>
  <text x="755" y="140" class="t">careerpilot-cortex</text>
  <text x="755" y="158" class="s">Python AI: FastAPI, ChromaDB</text>
  <text x="755" y="174" class="s">Playwright, embeddings</text>
  <rect x="800" y="80" width="70" height="24" rx="6" class="vol"/>
  <text x="835" y="96" class="vt">Chroma</text>

  <!-- Ollama -->
  <rect x="660" y="320" width="190" height="80" rx="10" class="box ai"/>
  <text x="755" y="350" class="t">ollama</text>
  <text x="755" y="368" class="s">LLM (CPU), qwen2.5:3b</text>
  <text x="755" y="384" class="s">private</text>
  <rect x="600" y="410" width="150" height="22" rx="6" class="vol"/>
  <text x="675" y="425" class="vt">models  /root/.ollama</text>

  <text x="640" y="180" class="l" style="text-anchor:end">CORTEX_URL</text>
  <text x="640" y="345" class="l" style="text-anchor:end">OLLAMA_URL</text>
  <text x="770" y="255" class="l" style="text-anchor:start">OLLAMA_URL</text>

  <!-- Request packets -->
  <circle r="5" fill="#34d399">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion>
  </circle>
  <circle r="5" fill="#34d399">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#p2"/></animateMotion>
  </circle>
  <circle r="5" fill="#a78bfa">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s"><mpath href="#p3"/></animateMotion>
  </circle>
  <circle r="5" fill="#a78bfa">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.0s"><mpath href="#p4"/></animateMotion>
  </circle>
  <circle r="5" fill="#a78bfa">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#p5"/></animateMotion>
  </circle>
  <!-- Responses travelling back -->
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.4s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
  </circle>
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.6s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
  </circle>

  <circle class="pulse" cx="80" cy="90" r="4" fill="#f59e0b"/>

  <!-- Legend -->
  <circle cx="30" cy="415" r="5" fill="#34d399"/><text x="42" y="419" class="s" style="text-anchor:start">request</text>
  <circle cx="110" cy="415" r="5" fill="#a78bfa"/><text x="122" y="419" class="s" style="text-anchor:start">AI call</text>
  <circle cx="185" cy="415" r="5" fill="#38bdf8"/><text x="197" y="419" class="s" style="text-anchor:start">response</text>
  <rect x="270" y="410" width="14" height="10" rx="2" class="vol"/><text x="290" y="419" class="s" style="text-anchor:start">volume</text>
</svg>
